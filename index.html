
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Signature Pad</title>
    <link rel="icon" href="https://www.jsign.com/wp-content/uploads/2022/06/graphic-signature-completeness.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f5f8;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --line: rgba(15, 23, 42, 0.08);
            --text: #101828;
            --muted: #667085;
            --primary: #111827;
            --primary-soft: rgba(17, 24, 39, 0.04);
            --success: #0f766e;
            --danger: #b42318;
            --shadow: rgba(16, 24, 40, 0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #f5f7fa 0%, #edf2f7 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .app-shell {
            width: min(820px, calc(100vw - 28px));
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: 0 18px 46px rgba(15, 23, 42, 0.07);
            padding: 20px 20px 18px;
            backdrop-filter: blur(8px);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #111827;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            color: #111827;
        }

        .status-badge {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: #f2f4f7;
            border: 1px solid var(--line);
            color: var(--muted);
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .tool {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .tool-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .tool input[type="color"] {
            width: 100%;
            height: 46px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 0;
            cursor: pointer;
        }

        .tool input[type="range"] {
            width: 100%;
            accent-color: #111827;
        }

        .tool select {
            width: 100%;
            height: 46px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            padding: 0 12px;
            font-size: 0.96rem;
        }

        .canvas-wrap {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 340px;
            background: white;
            border-radius: 12px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.02);
            cursor: crosshair;
            touch-action: none;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .left-actions,
        .right-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid transparent;
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 16px;
            letter-spacing: 0.01em;
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 16px rgba(15, 23, 42, 0.06);
        }

        .btn-secondary {
            background: #f5f7fa;
            border-color: var(--line);
            color: var(--text);
        }

        .btn-danger {
            background: #fff1f2;
            border-color: rgba(180, 35, 24, 0.12);
            color: var(--danger);
        }

        .btn-success {
            background: #0f172a;
            color: white;
        }

        .btn-warning {
            background: #f8fafc;
            border-color: var(--line);
            color: #111827;
        }

        @media (max-width: 820px) {
            .app-shell {
                width: min(100vw - 18px, 560px);
                padding: 14px 12px 12px;
            }

            .toolbar {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                gap: 10px;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }

            canvas {
                height: 280px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="app-header">
            <div class="brand">
                <div class="brand-mark">✒</div>
                <h1>Sign Master</h1>
            </div>
        </div>

        <div class="toolbar">
            <div class="tool">
                <label class="tool-label" for="colorPicker">Pen color</label>
                <input type="color" id="colorPicker" value="#111827" />
            </div>
            <div class="tool">
                <label class="tool-label" for="canvasColor">Background</label>
                <input type="color" id="canvasColor" value="#ffffff" />
            </div>
            <div class="tool">
                <label class="tool-label" for="lineWidthSlider">Stroke</label>
                <input type="range" id="lineWidthSlider" min="1" max="18" value="4" />
            </div>
            <div class="tool">
                <label class="tool-label" for="saveFormat">Format</label>
                <select id="saveFormat">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                </select>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="myCanvas" width="800" height="500" aria-label="Signature canvas"></canvas>
        </div>

        <div class="footer-actions">
            <div class="left-actions">
                <button type="button" class="btn btn-danger" id="clearButton">Clear</button>
                <button type="button" class="btn btn-secondary" id="undoButton">Undo</button>
            </div>

            <div class="right-actions">
                <button type="button" class="btn btn-success" id="saveButton">Download</button>
                <button type="button" class="btn btn-warning" id="retrieveButton">Load saved</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const canvasColor = document.getElementById('canvasColor');
        const saveFormat = document.getElementById('saveFormat');
        const clearButton = document.getElementById('clearButton');
        const undoButton = document.getElementById('undoButton');
        const saveButton = document.getElementById('saveButton');
        const retrieveButton = document.getElementById('retrieveButton');
        const lineWidthSlider = document.getElementById('lineWidthSlider');

        let strokes = [];
        let isDrawing = false;
        let activeStroke = null;

        const DEFAULT_COLOR = '#111827';
        const DEFAULT_BG = '#ffffff';

        function setCanvasBackground(color) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            redraw();
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = canvasColor.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            strokes.forEach((stroke) => {
                if (!stroke.points || stroke.points.length === 0) return;

                ctx.beginPath();
                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);

                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }

                ctx.strokeStyle = stroke.color;
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            });
        }

        function getPoint(event) {
            const rect = canvas.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
            const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
            return { x, y };
        }

        function startDrawing(event) {
            if (event.pointerType === 'mouse' && event.button !== 0) return;

            const point = getPoint(event);
            isDrawing = true;
            activeStroke = {
                color: colorPicker.value,
                width: Number(lineWidthSlider.value),
                points: [point]
            };

            strokes.push(activeStroke);
            canvas.setPointerCapture(event.pointerId);
            redraw();
        }

        function draw(event) {
            if (!isDrawing || !activeStroke) return;

            const point = getPoint(event);
            activeStroke.points.push(point);
            redraw();
        }

        function stopDrawing(event) {
            if (!isDrawing) return;
            isDrawing = false;
            activeStroke = null;
            if (event && event.pointerId !== undefined) {
                canvas.releasePointerCapture(event.pointerId);
            }
            localStorage.setItem('signaturePadSaved', canvas.toDataURL('image/png'));
        }

        function saveSignature() {
            const format = saveFormat.value;
            const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';

            canvas.toBlob((blob) => {
                if (!blob) return;

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `signature-${Date.now()}.${format}`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, mimeType, 0.95);
        }

        function retrieveSignature() {
            const saved = localStorage.getItem('signaturePadSaved');
            if (!saved) {
                alert('No saved signature found in this browser.');
                return;
            }

            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = canvasColor.value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = saved;
        }

        function clearCanvas() {
            strokes = [];
            activeStroke = null;
            isDrawing = false;
            redraw();
            localStorage.removeItem('signaturePadSaved');
        }

        function undoLastStroke() {
            if (strokes.length === 0) return;
            strokes.pop();
            redraw();
            localStorage.setItem('signaturePadSaved', canvas.toDataURL('image/png'));
        }

        colorPicker.addEventListener('input', (event) => {
            ctx.strokeStyle = event.target.value;
        });

        canvasColor.addEventListener('input', (event) => {
            setCanvasBackground(event.target.value);
        });

        lineWidthSlider.addEventListener('input', (event) => {
            const value = Number(event.target.value);
            ctx.lineWidth = value;
        });

        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointerleave', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
        canvas.addEventListener('contextmenu', (event) => event.preventDefault());

        clearButton.addEventListener('click', clearCanvas);
        undoButton.addEventListener('click', undoLastStroke);
        saveButton.addEventListener('click', saveSignature);
        retrieveButton.addEventListener('click', retrieveSignature);

        document.addEventListener('DOMContentLoaded', () => {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = DEFAULT_COLOR;
            ctx.lineWidth = Number(lineWidthSlider.value);
            colorPicker.value = DEFAULT_COLOR;
            canvasColor.value = DEFAULT_BG;
            setCanvasBackground(DEFAULT_BG);
        });
    </script>
</body>

</html>
